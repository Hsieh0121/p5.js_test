<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raindrop · 照片的可能時間</title>
<style>body{margin:0;background:#151b20;color:#e2e8ec;font:15px system-ui}header{padding:20px;max-width:1100px;margin:auto}h1{font-size:23px;margin:0 0 10px}p{color:#aebdc7;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{background:#283a46;border:1px solid #516a79;color:white;padding:9px;border-radius:5px}button{cursor:pointer}input[type=range]{width:min(600px,90vw)}#status{font-size:13px;min-height:22px;color:#b1d9cd}#canvas-host{text-align:center}canvas{max-width:96vw;max-height:75vh;width:auto!important;height:auto!important;object-fit:contain}a{color:#a9dcd7}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js" onerror="document.getElementById('status').textContent='p5.js 載入失敗，請確認網路後重新整理'"></script>
<script>window.cvReady=false;window.cvError='';var Module={onRuntimeInitialized(){window.cvReady=true;}};function cvLoaded(){if(typeof cv!=='undefined'&&cv.then){cv.then(instance=>{window.cv=instance;window.cvReady=true;});}else if(typeof cv!=='undefined'&&cv.Mat){window.cvReady=true;}}setTimeout(()=>{if(!window.cvReady)window.cvError='OpenCV 尚未就緒，請確認網路或重新整理。';},45000);</script>
<script async src="https://docs.opencv.org/4.13.0/opencv.js" onload="cvLoaded()" onerror="window.cvError='OpenCV 下載失敗，請確認網路後重新整理'"></script>
<script defer src="config.js"></script><script defer src="imageAnalysis.js"></script><script defer src="eventDetection.js"></script><script defer src="waveSimulation.js"></script><script defer src="sketch.js"></script>
</head><body><header><h1>讓影像跨出二維 · Raindrop</h1><p>照片是 t = 0。左側推測一條可能過去，右側模擬一條可能未來。先按 F 查看影像，再播放或拖曳時間。</p><nav>
<select id="view" aria-label="顯示模式"><option value="source">S 原始照片</option><option value="analysis">A 分析縮圖</option><option value="gray">G 灰階</option><option value="blur">B 模糊</option><option value="gradient">M 梯度</option><option value="edge">E 邊緣</option><option value="hough">H 原始候選</option><option value="radial">R 徑向篩選</option><option value="cluster">C 合併候選</option><option value="event">V 事件與信心值</option><option value="wave">W 波高</option><option value="displacement">D 位移</option><option value="final">F 最終影像</option></select>
<button id="play">播放</button><button id="reset">回到照片 0</button><select id="direction" aria-label="播放方向速度"><option value="1">向未來 1×</option><option value="0.5">向未來 0.5×</option><option value="-1">向過去 1×</option></select><button id="export">匯出高解析 PNG</button><button id="events">匯出事件 JSON</button><button id="apply">重新套用設定</button>
</nav><p><label for="timeline">可能過去 ← 照片 → 可能未來</label><br><input id="timeline" type="range" min="-2" max="4" step="0.005" value="0"><br><span id="time-label"></span></p><div id="status" role="status">正在載入照片與程式…</div><p>空白鍵 播放／暫停 · 0 回到照片 · S/A/G/B/M/E/H/R/C/V/W/D/F 切換診斷。<br><a href="docs/README.md">操作說明</a> · <a href="docs/PARAMETERS.md">參數表</a> · <a href="docs/LEARNING_GUIDE.md">學習指南</a></p></header><main id="canvas-host"></main></body></html>
